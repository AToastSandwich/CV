<!DOCTYPE html>
<html lang="th">
<head>
  <style>
    body {
      font-family: "Prompt", Tahoma, sans-serif;
      background-color: #4488FF;
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      color: #0000AA;
    }
    section {
      background-color: #BBBBFF;
      padding: 16px 24px;
      margin-bottom: 16px;
      border-radius: 12px;
      outline: 5px solid #0000AA;
    }
    header img {
      border-radius: 25%;
      outline: 5px solid #000066;
    }
    .btn {
      background-color: blue;
      color:white;
      padding: 10px 20px;
      border-radius:8px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #0000AA;
    }
    body.dark {
      background-color: #000055;
      color: #000099;
    }
    body.dark h1 {
      color: #0000FF;
    }
    body.dark p {
      color: #0000FF;
    }
    body.dark section {
      outline: 5px solid #0055FF;
    }
    body.dark img {
      outline: 5px solid #0055FF;
    }
    </style>
  <meta charset="UTF-8">
  <title>ชิติพัทธ์ อัชฌากุลกิจ</title>
</head>
<body>
  <header>
    <img src=https://www.purina.co.th/sites/default/files/2025-07/CAT%2520HERO_0023_Siamese%20%281%29.jpg alt="car" width="120">
    <h1>
      ชิติพัทธ์ อัชฌากุลกิจ
    </h1>
    <p>
      ผมอยู่ห้อง 4/5 เลขที่ 10 มาจากนนทบุรีครับ :]
    </p>
    <button class="btn" onclick="toggleDark()">
      Toggle Dark Mode
    </button>
  </header>
  <section>
  <h2>
    การศึกษา
  </h2>
  <ul>
    <li>ป.1-6 โรงเรียนเซนต์คาเบรียล</li>
    <li>ม.1-3 โรงเรียนสาธิต มศว ปทุมวัน</li>
    <li>ม.4-6 โรงเรียนมหิดลวิทยานุสรณ์</li>
  </ul>
  </section>
    
  <section>
  <h2>
    ทักษะ
  </h2>
  <ul>
    <li>สามารถพูดได้ 2 ภาษา</li>
    <li>สามารถเขียนโปรแกรมได้ 4 ภาษา</li>
  </ul>
  </section>
  
  <footer>
    <a href="https://github.com/AToastSandwich" class="btn">GitHub</a>
  </footer>
  <script>
    function toggleDark() {
      document.body.classList.toggle("dark");
    }
  </script>
</body>
</html>
